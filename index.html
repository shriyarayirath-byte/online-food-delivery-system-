<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Food Delivery System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

header{
    background:#ff5722;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:8px;
}

.search-box{
    margin:15px auto;
    max-width:600px;
    display:flex;
    gap:8px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

.location{
    background:white;
    padding:15px;
    margin:15px;
    border-radius:10px;
}

.location input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:7px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:15px;
}

.categories button{
    padding:10px 15px;
    border:none;
    border-radius:20px;
    background:#333;
    color:white;
    cursor:pointer;
}

.categories button:hover{
    background:#ff5722;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:8px;
}

.price{
    font-weight:bold;
    color:#ff5722;
    margin-bottom:10px;
}

.card button{
    width:100%;
    padding:10px;
    background:#ff5722;
    border:none;
    color:white;
    border-radius:7px;
    cursor:pointer;
}

.cart{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #ddd;
    gap:10px;
}

.qty button{
    padding:5px 10px;
    border:none;
    background:#333;
    color:white;
    border-radius:5px;
}

.total{
    margin-top:15px;
    font-size:18px;
}

.checkout{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:12px;
}

.checkout input{
    width:100%;
    padding:12px;
    margin:8px 0
