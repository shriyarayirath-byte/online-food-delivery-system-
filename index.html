<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Food Delivery System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fff8f2;color:#222;padding-bottom:90px}
header{background:#ff5722;color:white;text-align:center;padding:22px 12px}
header h1{font-size:26px}
header p{margin-top:6px}

.hero{text-align:center;background:#ffe0d2;padding:25px 15px}
.hero h2{margin-bottom:8px}
.search{width:95%;padding:13px;border:0;border-radius:25px;margin-top:15px}

.location,.checkout,#cartBox{
background:white;margin:15px;padding:16px;border-radius:15px;
box-shadow:0 2px 10px #ddd
}
.location input,.checkout input{
width:100%;padding:12px;margin-top:8px;border:1px solid #ddd;border-radius:8px
}

.categories{
display:flex;gap:10px;overflow-x:auto;padding:10px 15px
}
.categories button{
border:0;background:white;padding:12px 17px;border-radius:22px;
white-space:nowrap;box-shadow:0 2px 7px #ddd
}
.categories .active{background:#ff5722;color:white}

.container{padding:10px 15px}
.container h2{margin:15px 0}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:15px}

.card{
background:white;border-radius:15px;overflow:hidden;
box-shadow:0 3px 12px #ddd;padding-bottom:12px
}
.card img{width:100%;height:125px;object-fit:cover}
.card-content{padding:10px}
.card h3{font-size:16px}
.card p{font-size:12px;color:#777;margin:5px 0}
.price{color:#ff5722;font-weight:bold}
.add{
width:100%;border:0;background:#ff5722;color:white;
padding:9px;border-radius:8px;margin-top:8px
}

.cart-bar{
position:fixed;bottom:0;left:0;right:0;background:white;
padding:13px 16px;box-shadow:0 -3px 12px #bbb;
display:flex;justify-content:space-between;align-items:center;z-index:20
}
.cart-bar button,.order-btn{
